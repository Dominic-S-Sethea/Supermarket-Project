map $http_x_forwarded_proto $smos_effective_scheme {
    default $scheme;
    ~^https$ https;
}

map $smos_effective_scheme $smos_hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Shared security headers (CSP, conditional HSTS, X-Frame-Options, nosniff, Referrer, Permissions)
    include /etc/nginx/conf.d/security-headers.inc;

    # Reverse proxy API requests to Fastify backend (with SSE streaming support for AI Copilot)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smos_effective_scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        client_max_body_size 12m;

        # Consolidate security headers at the reverse-proxy edge to avoid duplicate CSP/Referrer headers
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $smos_hsts_header always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Cache self-hosted fonts aggressively while preserving all security headers
    location /fonts/ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Cache fingerprinted static assets aggressively while preserving all security headers
    location /assets/ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
