server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Shared security headers (CSP, HSTS, X-Frame-Options, nosniff, Referrer, Permissions)
    include /etc/nginx/conf.d/security-headers.inc;

    # Reverse proxy API requests to Fastify backend (with SSE streaming support for AI Copilot)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        client_max_body_size 12m;
    }

    # Cache fingerprinted static assets aggressively while preserving all security headers
    location /assets/ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
