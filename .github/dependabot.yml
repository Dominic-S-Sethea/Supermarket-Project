version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/services/analytics"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/apps/pos/src-tauri"
    schedule:
      interval: "weekly"
