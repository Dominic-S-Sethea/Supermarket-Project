name: Security, Supply Chain & Container Audit

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Node, Python & Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Enforce zero lint warnings
        run: pnpm lint
      - name: Fail on high/critical npm advisories (H-23)
        run: pnpm audit --audit-level=high
      - name: Audit Python analytics dependencies with pip-audit
        run: |
          uv --directory services/analytics export --frozen --no-dev --no-hashes -o /tmp/analytics-reqs.txt
          uvx pip-audit -r /tmp/analytics-reqs.txt
      - name: Rust Clippy (-D warnings) & ESC/POS unit tests
        run: |
          cargo clippy --manifest-path apps/pos/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/pos/src-tauri/Cargo.toml
      - name: Audit Rust Cargo.lock advisories (cargo-audit)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lockfile-path: apps/pos/src-tauri/Cargo.lock

  docker-build-and-trivy:
    name: Production Docker Builds & Trivy Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API production image
        run: docker build -f infra/Dockerfile.api -t supermarket-os-api:ci .
      - name: Build Web (unprivileged Nginx) production image
        run: docker build -f infra/Dockerfile.web -t supermarket-os-web:ci .
      - name: Build Python Analytics worker image
        run: docker build -f infra/Dockerfile.analytics -t supermarket-os-analytics:ci .
      - name: Trivy scan API image (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: supermarket-os-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Trivy scan Web image (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: supermarket-os-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Trivy scan Analytics image (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: supermarket-os-analytics:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
